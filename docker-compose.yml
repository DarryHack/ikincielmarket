services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ikinciel
      POSTGRES_PASSWORD: ikinciel_pw
      POSTGRES_DB: ikincielmarket
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ikinciel"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_APP: run.py
      FLASK_CONFIG: production
      SECRET_KEY: degistir-bunu-prod-icin
      DATABASE_URL: postgresql://ikinciel:ikinciel_pw@db:5432/ikincielmarket
      MAIL_SERVER: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USE_TLS: 1
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      ADMIN_EMAIL: admin@ikincielmarket.local
      ADMIN_PASSWORD: admin1234
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/app/static/uploads
    command: >
      sh -c "flask db upgrade &&
             gunicorn run:app --workers 2 --bind 0.0.0.0:5000"

volumes:
  pgdata:
  uploads:
