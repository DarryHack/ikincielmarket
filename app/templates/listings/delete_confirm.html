{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-danger">
      <div class="card-body">
        <h5 class="text-danger"><i class="bi bi-exclamation-triangle"></i> {{ _('İlanı silmek istediğine emin misin?') }}</h5>
        <p class="text-muted">"{{ listing.title }}" {{ _('kalıcı olarak silinecek.') }}</p>
        <form method="post">
          {{ form.hidden_tag() }}
          {{ form.submit(class="btn btn-danger") }}
          <a href="{{ url_for('listings.detail', listing_id=listing.id) }}" class="btn btn-link">{{ _('Vazgeç') }}</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
