{% extends "base.html" %}
{% block content %}
<h4 class="mb-3"><i class="bi bi-shield-lock"></i> {{ _('Yönetim Paneli') }}</h4>
<div class="row g-3">
  {% for k, v in stats.items() %}
  <div class="col-6 col-md-3">
    <div class="card text-center shadow-sm">
      <div class="card-body">
        <div class="display-6">{{ v }}</div>
        <div class="text-muted small text-uppercase">{{ k }}</div>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
<div class="mt-4 d-flex gap-2 flex-wrap">
  <a class="btn btn-outline-primary" href="{{ url_for('admin.users') }}"><i class="bi bi-people"></i> {{ _('Kullanıcılar') }}</a>
  <a class="btn btn-outline-primary" href="{{ url_for('admin.listings') }}"><i class="bi bi-list"></i> {{ _('Tüm ilanlar') }}</a>
  <a class="btn btn-outline-primary" href="{{ url_for('admin.categories') }}"><i class="bi bi-tags"></i> {{ _('Kategoriler') }}</a>
</div>
{% endblock %}
